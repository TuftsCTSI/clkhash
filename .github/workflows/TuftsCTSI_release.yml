name: TuftsCTSI release
run-name: Wheel for ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Attach wheel and SHA-256 to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS \
              --verify-tag --title "clkhash $GITHUB_REF_NAME (TuftsCTSI)" \
              --notes "A wheel for TuftsCTSI. Not published to PyPI."
          fi
