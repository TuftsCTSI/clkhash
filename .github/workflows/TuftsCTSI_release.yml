name: TuftsCTSI release
run-name: Wheel for ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  # On a version tag, publish a release with the wheel. Published releases are
  # immutable, so the release is built as a draft and published last.
  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Attest the wheel's build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Check that the tag has no published release
        run: |
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$DRAFT" != true ]; then
              echo "$TAG is already published, and a published release can't be changed"
              exit 1
            fi
            echo "Deleting the draft left by an earlier run"
            gh release delete "$TAG" --yes
          fi

      - name: Create a draft release with the wheel and its SHA-256
        run: |
          (cd dist && sha256sum *.whl > SHA256SUMS)
          gh release create "$TAG" --draft --verify-tag \
            --title "clkhash $TAG (TuftsCTSI)" \
            --notes "A wheel for TuftsCTSI. Not published to PyPI." \
            dist/*.whl dist/SHA256SUMS

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
